# Gradle 9.6.0 将运行在 Android Studio 自带的 JBR 25 上
# （Java 25 需要 Gradle 9.1.0+，8.x 会在解析 JDK 类时崩）
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# Compose 编译器插件内部仍在用 kotlin.sourceSets DSL，而 AGP 9 的内置 Kotlin
# 默认禁止这种写法。这是官方给出的抑制开关（不是绕过错误）：
# https://developer.android.com/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

# AGP 9 已默认开启以下开关，不要再显式写（会触发弃用警告）：
#   android.useAndroidX=true
#   android.nonTransitiveRClass=true
#   android.builtInKotlin=true
#   android.newDsl=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
